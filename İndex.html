<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Axeron | SMS Service</title>
    <style>
        body { background: #0a0c10; color: white; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .sms-card { background: #151921; padding: 40px; border-radius: 20px; border: 1px solid #2d343f; box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center; width: 350px; }
        h2 { color: #00d2ff; margin-bottom: 20px; }
        input { width: 100%; padding: 15px; margin-bottom: 20px; border-radius: 10px; border: 1px solid #333; background: #05070a; color: white; font-size: 16px; box-sizing: border-box; outline: none; }
        input:focus { border-color: #00d2ff; }
        .send-btn { width: 100%; padding: 15px; border-radius: 10px; border: none; background: #00d2ff; color: #000; font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.3s; }
        .send-btn:hover { background: #fff; transform: scale(1.02); }
        #log { margin-top: 20px; font-size: 13px; color: #888; }
    </style>
</head>
<body>

<div class="sms-card">
    <h2>SMS GÖNDƏR</h2>
    <p style="font-size: 14px; color: #8892b0;">Nömrəni daxil edin (məs: 507654321)</p>
    <input type="text" id="phoneInput" placeholder="Nömrə: 50XXXXXXX">
    <button class="send-btn" onclick="processSMS()">SMS GÖNDƏR</button>
    <div id="log"></div>
</div>

<script>
    async function processSMS() {
        let phone = document.getElementById('phoneInput').value;
        const log = document.getElementById('log');

        // Nömrəni təmizləyirik (yalnız rəqəmlər)
        let cleanPhone = phone.replace(/\D/g, '');

        // 994 formatına salırıq (Sənin Python kodundakı məntiq)
        if (!cleanPhone.startsWith('994')) {
            if (cleanPhone.startsWith('0')) {
                cleanPhone = '994' + cleanPhone.substring(1);
            } else {
                cleanPhone = '994' + cleanPhone;
            }
        }

        log.innerText = "⏳ Sorğu göndərilir: " + cleanPhone;
        log.style.color = "#00d2ff";

        // Million.az API-ya sorğu
        try {
            const response = await fetch("https://api.million.az/api/auth/send-otp", {
                method: "POST",
                headers: {
                    "accept": "application/json, text/plain, */*",
                    "content-type": "application/json",
                },
                body: JSON.stringify({ msisdn: cleanPhone })
            });

            if (response.ok) {
                log.innerText = "✅ SMS Uğurla Göndərildi!";
                log.style.color = "#00ff88";
            } else if (response.status === 429) {
                log.innerText = "❌ Xəta: Limit dolub (Too many requests)";
                log.style.color = "#ff4444";
            } else {
                log.innerText = "❌ Xəta Kodu: " + response.status;
                log.style.color = "#ff4444";
            }
        } catch (error) {
            log.innerText = "❌ Bağlantı Xətası (CORS bloklamış ola bilər)";
            log.style.color = "#ff4444";
            console.error(error);
        }
    }
</script>

</body>
</html>
